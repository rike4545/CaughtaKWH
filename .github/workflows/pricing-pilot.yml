name: Pricing Pilot Panel
on:
  workflow_dispatch:
    inputs:
      station_ids:
        description: Optional comma-separated override; blank uses the nearest 10 to Lake Grove
        required: false
        default: ''
      max_stations:
        description: Max pilot stations to scrape
        required: false
        default: '10'
  # The block cooldown starts at six hours; don't schedule a redundant run halfway
  # through that window. Manual dispatch remains available for a deliberate retry.
  schedule:
    - cron: '12 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: caughtakwh-data-writer
  cancel-in-progress: false
jobs:
  refresh-pilot:
    runs-on: ubuntu-latest
    env:
      PILOT_STATION_IDS: ${{ github.event.inputs.station_ids || '' }}
      PRICE_SCRAPE_LIMIT: ${{ github.event.inputs.max_stations || '10' }}
      PILOT_CLUSTER_SIZE: 10
      SCRAPE_DELAY_MS: 500
      AKAMAI_CIRCUIT_BREAKER: 3
      BLOCK_COOLDOWN_BASE_HOURS: 6
      BLOCK_COOLDOWN_MAX_HOURS: 72
      FETCH_MAX_ATTEMPTS: 2
      FETCH_RETRY_DELAY_MS: 750
      SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
      SCRAPE_PROXY_LIST: ${{ secrets.SCRAPE_PROXY_LIST }}
      SCRAPE_PROXY_LIST_URL: ${{ secrets.SCRAPE_PROXY_LIST_URL }}
      SCRAPE_PROXY_USERNAME: ${{ secrets.SCRAPE_PROXY_USERNAME }}
      SCRAPE_PROXY_PASSWORD: ${{ secrets.SCRAPE_PROXY_PASSWORD }}
      TESLA_HEADLESS: 'false'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Require a Tesla-accessible egress route
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/proxy-doctor.log"
          if npm run scrape:proxy-test 2>&1 | tee "$log_file"; then
            doctor_status=0
          else
            doctor_status=$?
          fi
          if [ "$doctor_status" -ne 0 ] || ! grep -Fq 'gets past Akamai' "$log_file"; then
            echo "::error::No configured egress route passed the live Tesla-page preflight. Pricing scrape and data commit are intentionally stopped; configure an authorized proxy that passes Proxy Doctor."
            exit 1
          fi

      - name: Build Lake Grove pricing cluster
        run: npm run pilot:lake-grove

      - name: Refresh pilot pricing panel
        run: |
          station_ids="$PILOT_STATION_IDS"
          if [ -z "$station_ids" ]; then
            station_ids="$(jq -r '.stationIds | join(",")' data/pilot-lake-grove.json)"
          fi
          echo "Refreshing Lake Grove cluster: $station_ids"
          xvfb-run -a env SCRAPE_STATION_IDS="$station_ids" MAX_STATIONS="$PRICE_SCRAPE_LIMIT" npm run scrape

      - name: Report actual scrape coverage
        if: always()
        run: node scripts/reportScrapeHealth.mjs

      - name: Rebuild predictions and public data
        run: |
          npm run predict
          node scripts/price-change-bot.mjs || true
          npm run sync:public
          npm run validate:data

      - name: Commit pilot pricing updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short
          git add data public/data reports || true

          if git diff --cached --quiet; then
            echo "No pilot pricing changes to commit."
            exit 0
          fi

          git commit -m "Refresh pilot Supercharger pricing"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin main

            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pilot pricing update pushed successfully."
              exit 0
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "Unable to push after rebasing. A newer conflicting data update may have landed."
          exit 1
