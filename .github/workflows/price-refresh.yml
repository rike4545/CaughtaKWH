name: Dynamic Tesla Pricing Refresh
on:
  workflow_dispatch:
    inputs:
      max_stations:
        description: Max station pricing pages to scrape this run
        required: false
        default: '100'
      scrape_states:
        description: Optional comma-separated states/provinces to limit this run to, for example CA,NV,ON
        required: false
        default: ''
      priority_states:
        description: Optional regional priority states/provinces, e.g. NY,NJ; scheduled runs also read the SCRAPE_PRIORITY_STATES repository variable
        required: false
        default: ''
      scrape_countries:
        description: Optional comma-separated countries to refresh; default data is United States-first
        required: false
        default: ''
      scrape_zip:
        description: Optional US ZIP code for a nearby-first refresh
        required: false
        default: ''
      scrape_lat:
        description: Optional latitude for a nearby-first refresh
        required: false
        default: ''
      scrape_lng:
        description: Optional longitude for a nearby-first refresh
        required: false
        default: ''
      scrape_radius_miles:
        description: Radius for ZIP/lat/lng nearby refresh
        required: false
        default: '150'
      needs_history:
        description: Only refresh stations that need usable price history
        required: false
        default: 'false'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: caughtakwh-data-writer
  cancel-in-progress: false
jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    env:
      PRICE_SCRAPE_LIMIT: ${{ github.event.inputs.max_stations || '100' }}
      SCRAPE_DELAY_MS: 1500
      SCRAPE_ROTATE_STATES: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      # 8 states/day (was 4). The window slides by 1 state/day, so the 52-region sweep period is
      # unchanged, but each state now gets an 8-day coverage burst (was 4) and twice as many
      # states are in play daily — time to first-cover-every-state drops from ~49 to ~45 days.
      # The 100-station per-run cap is unchanged, so this widens the net without adding per-run
      # load; priority scoring still picks what to hit. Raise further once a proxy lifts blocks.
      SCRAPE_ROTATION_COUNT: 8
      SCRAPE_STATES: ${{ github.event.inputs.scrape_states || '' }}
      SCRAPE_PRIORITY_STATES: ${{ github.event.inputs.priority_states || vars.SCRAPE_PRIORITY_STATES || 'NY,NJ,CT' }}
      SCRAPE_COUNTRIES: ${{ github.event.inputs.scrape_countries || '' }}
      SCRAPE_ZIP: ${{ github.event.inputs.scrape_zip || '' }}
      SCRAPE_LAT: ${{ github.event.inputs.scrape_lat || '' }}
      SCRAPE_LNG: ${{ github.event.inputs.scrape_lng || '' }}
      SCRAPE_RADIUS_MILES: ${{ github.event.inputs.scrape_radius_miles || '150' }}
      SCRAPE_NEEDS_HISTORY: ${{ github.event.inputs.needs_history || (github.event_name == 'schedule' && 'true' || 'false') }}
      AKAMAI_CIRCUIT_BREAKER: 3
      BLOCK_COOLDOWN_BASE_HOURS: 6
      BLOCK_COOLDOWN_MAX_HOURS: 72
      FETCH_MAX_ATTEMPTS: 2
      FETCH_RETRY_DELAY_MS: 750
      ROUTE_BLOCK_COOLDOWN_MINUTES: 30
      ROUTE_CANARY_STATIONS: 1
      # Optional authorized proxy routing. Set endpoints in SCRAPE_PROXY_LIST as one
      # IP:PORT or HTTP(S) proxy URL per line; shared provider credentials are separate secrets.
      SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
      SCRAPE_PROXY_LIST: ${{ secrets.SCRAPE_PROXY_LIST }}
      SCRAPE_PROXY_USERNAME: ${{ secrets.SCRAPE_PROXY_USERNAME }}
      SCRAPE_PROXY_PASSWORD: ${{ secrets.SCRAPE_PROXY_PASSWORD }}
      # Optional trusted provider proxy-list download URL; do not commit its token or credentials.
      SCRAPE_PROXY_LIST_URL: ${{ secrets.SCRAPE_PROXY_LIST_URL }}
      # NLR API key is used server-side for AFDC station metadata and backup validation.
      NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
      NLR_STATES: NY,NJ,CT
      TESLA_HEADLESS: 'false'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Import NLR AFDC Tesla station metadata (NY/NJ/CT)
        if: env.NLR_API_KEY != ''
        run: npm run import:nlr-afdc
      - name: Verify authorized Tesla access route
        run: npm run scrape:proxy-test
      - name: Refresh dynamic Tesla pricing
        run: xvfb-run -a env MAX_STATIONS=$PRICE_SCRAPE_LIMIT npm run scrape
      - name: Report scrape coverage
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/scrape-health.json';
          if (!fs.existsSync(file)) {
            console.error('::error::Scraper did not produce data/scrape-health.json.');
            process.exit(1);
          }
          const health = JSON.parse(fs.readFileSync(file, 'utf8'));
          const summary = {
            generatedAt: health.generatedAt,
            attempted: health.attempted ?? 0,
            validPages: health.validPages ?? 0,
            savedObservations: health.savedObservations ?? 0,
            blocked: health.blocked ?? 0,
            failed: health.failed ?? 0,
            proxyConfigured: health.transport?.proxyConfigured ?? false,
            activeHost: health.transport?.proxyPool?.activeHost ?? null
          };
          console.log('Scrape health:', JSON.stringify(summary, null, 2));
          if (summary.validPages === 0 && summary.attempted > 0) {
            console.log('::warning::Scraper reached no usable Tesla pages. Existing historical/public data will be retained; do not interpret this run as a successful price refresh.');
          } else if (summary.validPages > 0 && summary.savedObservations === 0) {
            console.log('::warning::Tesla pages loaded, but no new observations were saved. Check whether pages contained current pricing or availability.');
          }
          NODE
      - name: Rebuild predictions and public data
        run: |
          npm run predict
          node scripts/price-change-bot.mjs || true
          npm run sync:public
          npm run validate:data
      - name: Commit pricing updates
        run: |
          set -euo pipefail

          git config user.name "Bryan Carroll"
          git config user.email "carrollbh@gmail.com"

          git status --short

          git add data public/data reports || true

          if git diff --cached --quiet; then
            echo "No pricing changes to commit."
            exit 0
          fi

          git commit -m "Refresh dynamic Tesla pricing"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git fetch origin main

            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pricing update pushed successfully."
              exit 0
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "Unable to push after rebasing. A newer conflicting data update may have landed."
          exit 1
